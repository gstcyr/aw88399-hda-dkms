PACKAGE_NAME="aw88399-hda-dkms"
PACKAGE_VERSION="1.0"

# Deliberately "no", which is unusual for a DKMS package.
#
# These modules are built against vendored copies of private kernel headers, so they
# are only safe on a kernel whose struct layouts match those copies -- and a mismatch
# compiles cleanly, then corrupts memory at boot (see preflight-abi-check.sh). With
# AUTOINSTALL="yes", apt would rebuild them for a brand-new kernel nobody had verified
# and you would boot straight into a page fault that kills the analog audio card.
#
# "no" fails safe instead: after a kernel update the new kernel just has stock audio
# (silent speakers, healthy card). Boot it, run preflight-abi-check.sh, then re-run
# install-dkms-signed.sh.
AUTOINSTALL="no"

MAKE="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"

# All modules are declared at the top level of the Makefile (module names cannot
# contain '/' on kernel 7.0+), so every .ko lands in the build root.

# Module 0: Patched Realtek ALC269 codec (with AW88399 fixup)
BUILT_MODULE_NAME[0]="snd-hda-codec-alc269"
BUILT_MODULE_LOCATION[0]="./"
DEST_MODULE_LOCATION[0]="/updates/dkms"

# Module 1: Patched ASoC AW88399 codec (with exports)
BUILT_MODULE_NAME[1]="snd-soc-aw88399"
BUILT_MODULE_LOCATION[1]="./"
DEST_MODULE_LOCATION[1]="/updates/dkms"

# Module 2: New HDA side codec driver
BUILT_MODULE_NAME[2]="snd-hda-scodec-aw88399"
BUILT_MODULE_LOCATION[2]="./"
DEST_MODULE_LOCATION[2]="/updates/dkms"

# Module 3: New HDA I2C interface
BUILT_MODULE_NAME[3]="snd-hda-scodec-aw88399-i2c"
BUILT_MODULE_LOCATION[3]="./"
DEST_MODULE_LOCATION[3]="/updates/dkms"

# Module 4: Patched serial-multi-instantiate
BUILT_MODULE_NAME[4]="serial-multi-instantiate"
BUILT_MODULE_LOCATION[4]="./"
DEST_MODULE_LOCATION[4]="/updates/dkms"

# Module 5: Setup helper (scan.c workaround)
BUILT_MODULE_NAME[5]="aw88399-setup"
BUILT_MODULE_LOCATION[5]="./"
DEST_MODULE_LOCATION[5]="/updates/dkms"
